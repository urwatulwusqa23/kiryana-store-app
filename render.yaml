# Render Blueprint: API + free PostgreSQL (one deploy).
# In Render: Blueprints → New → connect this repo → use this file (default path: render.yaml).
# After deploy, copy the Web Service URL and set it in Vercel as VITE_API_URL (see docs).
#
# Adjust `repo` to your GitHub URL if the dashboard asks for it.

databases:
  - name: kiryana-db
    plan: free
    region: oregon

services:
  - type: web
    name: kiryana-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Kestrel listen port: Program.cs sets ASPNETCORE_URLS from Render's PORT before the host starts.
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: kiryana-db
          property: connectionString
      # Required for the API to start accepting logins/requests — see docs for how to generate these.
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: KiryanaStore
      - key: Cors__AllowedOrigins__0
        sync: false
